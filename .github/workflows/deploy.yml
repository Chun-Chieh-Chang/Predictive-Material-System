name: Deploy to GitHub Pages

on:
  # 每次推送至 master 分支時自動觸發
  push:
    branches:
      - master
  # 允許從 Actions 頁面手動觸發
  workflow_dispatch:

# 設定 GitHub Pages 部署所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署任務在執行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Job: Quality Gate（所有檢查通過後才進入部署）
  # ─────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: MECE template validation
        run: npm run mec:check:all

      - name: Contrast ratio check
        run: node .impeccable/scripts/contrast-check.mjs src/components/

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

  # ─────────────────────────────────────────
  # Job: Build & Deploy
  # ─────────────────────────────────────────
  build-and-deploy:
    name: Build and Deploy to GitHub Pages
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 預設輸出目錄
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ─────────────────────────────────────────
  # Job: Deploy Verification（部署後自動驗證網站可用性）
  # PA-02：推送成功 = git push + Actions success + URL 200 OK
  # 新增：結構化日誌輸出 → docs/.audit/deploy-audit.jsonl（可被工具備份與分析）
  # ─────────────────────────────────────────
  verify-deploy:
    name: Verify Deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Wait for Pages propagation
        run: sleep 30

      - name: Check deployment URL
        id: url-check
        run: |
          set -e
          URL="https://chun-chieh-chang.github.io/Predictive-Material-System/"
          echo "  → 驗證部署網址: $URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "000")

          BODY=""
          if [ "$HTTP_CODE" = "200" ]; then
            BODY=$(curl -s --max-time 15 "$URL")
          fi

          CONTENT_OK=false
          if echo "$BODY" | grep -q "料事如神"; then
            CONTENT_OK=true
          fi

          echo "HTTP_CODE=$HTTP_CODE" >> $GITHUB_ENV
          echo "CONTENT_OK=$CONTENT_OK" >> $GITHUB_ENV
          echo "  → HTTP=$HTTP_CODE content_match=$CONTENT_OK"

      - name: Generate deploy audit log
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=${{ github.sha }}
          RUN_ID=${{ github.run_id }}
          WORKFLOW=${{ github.workflow }}

          AUDIT_DIR="docs/.audit"
          mkdir -p "$AUDIT_DIR"
          AUDIT_FILE="$AUDIT_DIR/deploy-audit.jsonl"

          ENTRY=$(cat <<EOF
          {"timestamp":"$TIMESTAMP","commit_sha":"$COMMIT_SHA","run_id":$RUN_ID,"workflow":"$WORKFLOW",
          "url":"https://chun-chieh-chang.github.io/Predictive-Material-System/",
          "http_code":"${{ env.HTTP_CODE }}",
          "content_match":"${{ env.CONTENT_OK }}",
          "status":"${{ env.CONTENT_OK == 'true' && env.HTTP_CODE == '200' && 'success' || 'failure' }}" }
          EOF
          )
          echo "$ENTRY" >> "$AUDIT_FILE"
          cat "$AUDIT_FILE" | tail -1

      - name: Commit audit log
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/.audit/deploy-audit.jsonl
          git commit -m "chore: deploy audit log (${{ github.run_id }})" || echo "No changes to commit"
          git push

      - name: Fail if deployment invalid
        if: env.CONTENT_OK != 'true' || env.HTTP_CODE != '200'
        run: |
          echo "❌ 部署驗證失敗：HTTP ${{ env.HTTP_CODE }} content_match=${{ env.CONTENT_OK }}"
          echo "日誌已寫入 docs/.audit/deploy-audit.jsonl"
          exit 1
